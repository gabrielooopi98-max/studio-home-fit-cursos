<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada | Studio HomeFit</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <!--
      Página de erro servida pela hospedagem (Netlify, Vercel, GitHub Pages...) quando o
      endereço não existe. Dentro do site, o próprio app mostra a mesma página (rota #/404).
      Fontes: as mesmas do site, hospedadas em /fontes.
    -->
    <style>
      @font-face {
        font-family: 'Montserrat';
        font-weight: 600 900;
        font-display: swap;
        src: url('/fontes/montserrat-variavel.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Barlow';
        font-weight: 500;
        font-display: swap;
        src: url('/fontes/barlow-500.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Barlow';
        font-weight: 700;
        font-display: swap;
        src: url('/fontes/barlow-700.woff2') format('woff2');
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a0a0b;
        color: #fff;
        font-family: 'Barlow', system-ui, sans-serif;
        font-weight: 500;
        text-align: center;
      }

      main {
        max-width: 560px;
      }

      .code {
        display: inline-block;
        padding: 6px 12px;
        background: #1f5bff;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.8rem;
        transform: skewX(-10deg);
        box-shadow: 3px 3px 0 #fff;
      }

      h1 {
        margin: 24px 0 12px;
        font-family: 'Montserrat', system-ui, sans-serif;
        font-weight: 900;
        font-size: clamp(2.2rem, 8vw, 3.6rem);
        line-height: 1;
        text-transform: uppercase;
        text-wrap: balance;
      }

      h1 span {
        color: #1f5bff;
      }

      p {
        margin: 0 0 28px;
        color: #9a9fa8;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        height: 52px;
        padding: 0 26px;
        border-radius: 12px;
        background: #1f5bff;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        background: #1748d6;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="code">Erro 404</span>
      <h1>Página não <span>encontrada</span></h1>
      <p>O endereço que você acessou não existe ou mudou de lugar. Volte para o Studio HomeFit e continue o treino.</p>
      <a href="/">Ir para o início</a>
    </main>
  </body>
</html>
